baseURL = "https://pdfcpu.io/"
locale = "en-US"
title = "pdfcpu"
disableKinds = ["taxonomy", "term"]

[params]
  description = "PDF tooling for Go and the command line."
  metaDescription = "pdfcpu provides a Go API and CLI for validating, optimizing, splitting, merging, extracting, and transforming PDF files. It supports command-line workflows, server-side automation, and direct PDF control from Go applications."
  logo = "/resources/logoSmall.png"
  repositoryURL = "https://github.com/pdfcpu/pdfcpu"
  googleAnalyticsID = "UA-138739451-1"

[markup]
  [markup.highlight]
    style = "github"
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[outputs]
  home = ["HTML"]
  page = ["HTML"]
  section = ["HTML"]
